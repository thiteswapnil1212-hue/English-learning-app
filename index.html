<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="An interactive English learning application designed for Grade 7 students."
    >

    <meta name="theme-color" content="#1f4e79">

    <title>English Learning | Grade 7</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Noto+Sans+Marathi:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div id="app">

        <!-- =========================================
             Application Header
        ========================================== -->

        <header class="lesson-header">

            <div class="header-content">

                <div class="lesson-brand">
                    <div class="brand-mark" aria-hidden="true">
                        EN
                    </div>

                    <div class="brand-copy">
                        <span class="brand-title">
                            English Learning
                        </span>

                        <span class="brand-subtitle">
                            Grade 7
                        </span>
                    </div>
                </div>

                <div
                    id="progress-bar-container"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    aria-label="Lesson progress"
                >
                    <div class="progress-info">
                        <span>Lesson progress</span>
                        <span id="progress-text">0%</span>
                    </div>

                    <div class="progress-track">
                        <div id="progress-bar"></div>
                    </div>
                </div>

            </div>

        </header>


        <!-- =========================================
             Learning Objectives
        ========================================== -->

        <aside
            id="objectives-panel"
            aria-label="Lesson objectives"
        >

            <button
                id="toggle-objectives"
                type="button"
                aria-expanded="false"
                aria-controls="objectives-content"
            >
                <span>Objectives</span>
                <span
                    class="panel-chevron"
                    aria-hidden="true"
                >
                    +
                </span>
            </button>

            <div
                id="objectives-content"
                class="hidden"
            >

                <div class="panel-heading">
                    <span class="panel-eyebrow">
                        TODAY'S LESSON
                    </span>

                    <h3>
                        What you will learn
                    </h3>
                </div>

                <ul id="objectives-list">

                    <li
                        class="objective-item"
                        data-complete="false"
                    >
                        <span
                            class="objective-status"
                            aria-hidden="true"
                        ></span>

                        <span>
                            Say "Hello!"
                        </span>
                    </li>

                    <li
                        class="objective-item"
                        data-complete="false"
                    >
                        <span
                            class="objective-status"
                            aria-hidden="true"
                        ></span>

                        <span>
                            Say "My name is..."
                        </span>
                    </li>

                    <li
                        class="objective-item"
                        data-complete="false"
                    >
                        <span
                            class="objective-status"
                            aria-hidden="true"
                        ></span>

                        <span>
                            Ask "What is your name?"
                        </span>
                    </li>

                    <li
                        class="objective-item"
                        data-complete="false"
                    >
                        <span
                            class="objective-status"
                            aria-hidden="true"
                        ></span>

                        <span>
                            Respond confidently
                        </span>
                    </li>

                </ul>

            </div>

        </aside>


        <!-- =========================================
             Main Learning Area
        ========================================== -->

        <main
            id="main-content"
            tabindex="-1"
            aria-live="polite"
        >
            <!-- Lesson screens are rendered by app.js -->
        </main>


        <!-- =========================================
             Lesson Navigation
        ========================================== -->

        <nav
            id="teacher-nav"
            aria-label="Lesson navigation"
        >

            <button
                id="prev-btn"
                class="nav-btn"
                type="button"
                disabled
                aria-label="Go to previous screen"
            >
                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ←
                </span>

                <span>
                    Previous
                </span>
            </button>


            <button
                id="pause-btn"
                class="nav-btn"
                type="button"
                aria-label="Pause lesson"
                aria-pressed="false"
            >
                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ||
                </span>

                <span>
                    Pause
                </span>
            </button>


            <button
                id="next-btn"
                class="nav-btn nav-btn-primary"
                type="button"
                aria-label="Go to next screen"
            >
                <span>
                    Next
                </span>

                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    →
                </span>
            </button>


            <button
                id="restart-btn"
                class="nav-btn restart-btn"
                type="button"
                aria-label="Restart lesson"
            >
                Restart
            </button>

        </nav>


        <!-- =========================================
             Narration Controls
        ========================================== -->

        <section
            id="narration-controls"
            aria-label="Narration controls"
        >

            <button
                id="replay-narration-btn"
                class="narration-btn"
                type="button"
                onclick="replayNarration()"
                title="नरेशन परत ऐका / Replay narration"
                aria-label="Replay narration"
            >
                <span
                    class="narration-icon"
                    aria-hidden="true"
                >
                    ◀
                </span>

                <span>
                    परत ऐका
                </span>
            </button>


            <div class="narration-speed-group">

                <label
                    class="narration-label"
                    for="narration-speed"
                >
                    गती
                </label>

                <select
                    id="narration-speed"
                    onchange="setNarrationSpeed(this.value)"
                    title="Narration speed"
                    aria-label="Narration speed"
                >
                    <option value="normal">
                        साधारण
                    </option>

                    <option value="slow">
                        हळू
                    </option>

                    <option value="very-slow">
                        खूप हळू
                    </option>
                </select>

            </div>


            <div
                id="narration-mode-indicator"
                class="narration-mode-tts"
                title="Narration source"
                role="status"
            >
                TTS
            </div>

        </section>


        <!-- =========================================
             Teacher Notes
        ========================================== -->

        <aside
            id="teacher-notes"
            aria-label="Teacher notes"
        >

            <button
                id="toggle-notes"
                type="button"
                aria-expanded="false"
                aria-controls="notes-content"
            >
                <span>
                    Teacher notes
                </span>

                <span
                    class="panel-chevron"
                    aria-hidden="true"
                >
                    +
                </span>
            </button>

            <div
                id="notes-content"
                class="hidden"
            >

                <div class="panel-heading">

                    <span class="panel-eyebrow">
                        TEACHER SUPPORT
                    </span>

                    <h3>
                        Teacher Notes
                    </h3>

                </div>

                <p id="notes-text">
                    Teacher guidance for the current lesson will appear here.
                </p>

            </div>

        </aside>


        <!-- =========================================
             Buddy the Parrot
        ========================================== -->

        <div
            class="buddy-container"
            aria-label="Buddy the Parrot"
        >

            <div
                class="buddy-speech-bubble hidden"
                id="buddy-speech"
                role="status"
                aria-live="polite"
            ></div>

            <img
                src="buddy-mascot.svg"
                alt="Buddy the Parrot"
                class="buddy-mascot"
                id="buddy-mascot"
            >

        </div>


        <!-- =========================================
             Screen Reader Status
        ========================================== -->

        <div
            id="app-status"
            class="sr-only"
            aria-live="polite"
            aria-atomic="true"
        ></div>

    </div>


    <!-- =========================================
         Application Script
    ========================================== -->

    <script
        src="app.js"
        defer
    ></script>

</body>
</html>
