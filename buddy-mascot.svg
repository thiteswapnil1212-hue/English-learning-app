<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" id="buddy-mascot">
  <defs>
    <!-- Gradient for body -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    
    <!-- Gradient for cap -->
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    
    <!-- Gradient for beak -->
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800"/>
      <stop offset="100%" style="stop-color:#F57C00"/>
    </linearGradient>
    
    <!-- Eye gradient -->
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="70%" style="stop-color:#E3F2FD"/>
      <stop offset="100%" style="stop-color:#90CAF9"/>
    </radialGradient>
  </defs>
  
  <!-- Body -->
  <ellipse cx="100" cy="120" rx="60" ry="50" fill="url(#bodyGradient)" class="buddy-body"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="45" fill="url(#bodyGradient)" class="buddy-head"/>
  
  <!-- Left Wing -->
  <ellipse cx="55" cy="115" rx="25" ry="35" fill="url(#bodyGradient)" class="buddy-wing-left" transform="rotate(-20 55 115)"/>
  
  <!-- Right Wing -->
  <ellipse cx="145" cy="115" rx="25" ry="35" fill="url(#bodyGradient)" class="buddy-wing-right" transform="rotate(20 145 115)"/>
  
  <!-- Tail feathers -->
  <g class="buddy-tail">
    <ellipse cx="100" cy="165" rx="15" ry="25" fill="url(#bodyGradient)" transform="rotate(-15 100 165)"/>
    <ellipse cx="100" cy="165" rx="15" ry="25" fill="url(#bodyGradient)" transform="rotate(0 100 165)"/>
    <ellipse cx="100" cy="165" rx="15" ry="25" fill="url(#bodyGradient)" transform="rotate(15 100 165)"/>
  </g>
  
  <!-- Feet -->
  <g class="buddy-feet">
    <ellipse cx="80" cy="170" rx="12" ry="6" fill="#FF9800"/>
    <ellipse cx="120" cy="170" rx="12" ry="6" fill="#FF9800"/>
  </g>
  
  <!-- School Cap -->
  <ellipse cx="100" cy="35" rx="35" ry="12" fill="url(#capGradient)" class="buddy-cap"/>
  <rect x="65" y="25" width="70" height="15" rx="5" fill="url(#capGradient)" class="buddy-cap-top"/>
  <ellipse cx="100" cy="40" rx="38" ry="14" fill="none" stroke="#1565C0" stroke-width="2" class="buddy-cap-brim"/>
  
  <!-- Left Eye -->
  <g class="buddy-eye-left">
    <ellipse cx="80" cy="65" rx="18" ry="20" fill="white" class="buddy-eye-white"/>
    <circle cx="80" cy="68" r="12" fill="url(#eyeGradient)" class="buddy-eye-iris"/>
    <circle cx="80" cy="68" r="6" fill="#1A237E" class="buddy-eye-pupil"/>
    <circle cx="77" cy="65" r="3" fill="white" class="buddy-eye-shine"/>
  </g>
  
  <!-- Right Eye -->
  <g class="buddy-eye-right">
    <ellipse cx="120" cy="65" rx="18" ry="20" fill="white" class="buddy-eye-white"/>
    <circle cx="120" cy="68" r="12" fill="url(#eyeGradient)" class="buddy-eye-iris"/>
    <circle cx="120" cy="68" r="6" fill="#1A237E" class="buddy-eye-pupil"/>
    <circle cx="117" cy="65" r="3" fill="white" class="buddy-eye-shine"/>
  </g>
  
  <!-- Beak -->
  <path d="M 95 80 Q 100 95 105 80 Q 100 75 95 80" fill="url(#beakGradient)" class="buddy-beak"/>
  <ellipse cx="100" cy="82" rx="8" ry="4" fill="#FFE0B2" class="buddy-beak-highlight"/>
  
  <!-- Cheeks -->
  <ellipse cx="65" cy="80" rx="8" ry="5" fill="#FFAB91" opacity="0.6" class="buddy-cheek-left"/>
  <ellipse cx="135" cy="80" rx="8" ry="5" fill="#FFAB91" opacity="0.6" class="buddy-cheek-right"/>
  
  <!-- Belly highlight -->
  <ellipse cx="100" cy="125" rx="30" ry="25" fill="#81C784" opacity="0.4" class="buddy-belly"/>
</svg>
